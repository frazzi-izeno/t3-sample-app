kind: Deployment
apiVersion: apps/v1
metadata:
  name: custom-api
  labels:
    app: custom-api
    tier: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: custom-api
  template:
    metadata:
      labels:
        app: custom-api
    spec:
      containers:
        - name: custom-api
          image: default-route-openshift-image-registry.apps-crc.testing/shared-images/custom-app-api:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DB_HOST
              value: qod-db
            - name: DB_USER
              value: root
            - name: DB_PASS
              value: root
          imagePullPolicy: Always
      restartPolicy: Always


---

apiVersion: v1
kind: Service
metadata:
  name: custom-api
  labels:
    app: custom-api
    tier: api
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: custom-api
